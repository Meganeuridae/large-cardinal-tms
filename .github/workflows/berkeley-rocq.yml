name: Verify Berkeley1399
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: berkeley-rocq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: 5.5.2
      - name: Install pinned Rocq toolchain
        run: opam install -y rocq-core.9.3.0 rocq-stdlib.9.2.0
      - name: Verify the complete theorem
        run: opam exec -- python3 verify.py
      - name: Run verifier negative controls
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce the machine
        run: python3 tools/rebuild_machine.py
      - name: Reproduce finite certificates
        run: python3 tools/rebuild_certificates.py
      - name: Preserve verification report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: berkeley1399-verification
          path: |
            berkeley-rocq/.build/verification.json
            berkeley-rocq/.build/compile.log
            berkeley-rocq/.build/kernel-check.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
