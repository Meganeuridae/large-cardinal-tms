name: Verify Berkeley1399
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: berkeley-rocq
    env:
      OPAMYES: "1"
      OPAMJOBS: "2"
      OPAMRETRIES: "5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap opam and pinned OCaml
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes opam build-essential libgmp-dev pkg-config
          opam init --bare --disable-sandboxing --yes
          opam switch create . ocaml-base-compiler.5.5.2 --yes
      - name: Install pinned Rocq toolchain
        run: opam install --switch "$GITHUB_WORKSPACE" -y rocq-core.9.3.0 rocq-stdlib.9.2.0
      - name: Verify the complete theorem
        run: opam exec --switch "$GITHUB_WORKSPACE" -- python3 verify.py
      - name: Run verifier negative controls
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce the machine
        run: python3 tools/rebuild_machine.py
      - name: Reproduce finite certificates
        run: python3 tools/rebuild_certificates.py
      - name: Preserve verification report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: berkeley1399-verification
          path: |
            berkeley-rocq/.build/verification.json
            berkeley-rocq/.build/compile.log
            berkeley-rocq/.build/kernel-check.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
